<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alugueres de Campo (Fut 7) | ADC Sanguedo</title>
<meta name="description" content="Aluga o campo de Futebol de 7 da ADC Sanguedo. Marca o teu horário." />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preload" href="fonts/oswald-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body data-page="alugueres">
<header data-site-nav></header>
<noscript><nav class="nav-nojs" aria-label="Principal"><a href="index.html">Início</a><a href="sobre.html">Sobre nós</a><a href="estrutura.html">Estrutura</a><a href="socios.html">Sócios</a><a href="loja.html">Loja</a><a href="alugueres.html">Alugueres</a><a href="contactos.html">Contactos</a></nav></noscript>
<main>
  <header class="pagehead on-dark">
    <div class="bar stripes"></div>
    <div class="wrap"><h1>Alugueres de campo</h1><p id="alugIntro">O campo de Futebol de 7 do clube está disponível para aluguer.</p></div>
  </header>
  <section class="section">
    <div class="wrap">
      <div class="alug">
        <div>
          <div class="alug__price stripes">
            <div class="sub">Preço</div>
            <div class="big" id="alugPreco"></div>
            <div class="sub" id="alugHorario"></div>
          </div>
          <p class="eyebrow">Condições</p>
          <ul id="alugCond"></ul>
        </div>
        <div>
          <p class="eyebrow">Pedir reserva</p>
          <h2 class="section-title section-title--sm">Marca o teu jogo</h2>
          <form class="form form--gap" id="alugForm">
            <div class="field"><label for="aNome">Nome</label><input id="aNome" maxlength="80" autocomplete="name" placeholder="O teu nome" required /></div>
            <div class="field"><label for="aTel">Contacto <span class="opt">(opcional)</span></label><input id="aTel" maxlength="40" autocomplete="tel" placeholder="Telemóvel ou e-mail" /></div>
            <div class="row2">
              <div class="field"><label for="aData">Data</label><input type="date" id="aData" required /></div>
              <div class="field"><label for="aHora">Hora</label><input type="time" id="aHora" aria-describedby="aHoraAjuda" required /><small class="field__help" id="aHoraAjuda"></small></div>
            </div>
            <div class="form__btns">
              <button type="submit" class="btn btn--solid" value="whatsapp">Pedir por WhatsApp</button>
              <button type="submit" class="btn btn--ghost" value="email">Pedir por e-mail</button>
            </div>
            <p class="form__msg" id="alugMsg" role="status" hidden></p>
            <p class="cart__note form__note">O pedido é confirmado pela direção consoante a disponibilidade.</p>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>
<footer data-site-footer></footer>
<script src="js/config.js?v=11" defer></script>
<script src="js/site.js?v=11" defer></script>
<script src="js/pages.js?v=11" defer></script>
</body>
</html>
