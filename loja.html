<body data-page="loja">
<header data-site-nav></header>
<noscript><nav class="nav-nojs" aria-label="Principal"><a href="index.html">Início</a><a href="sobre.html">Sobre nós</a><a href="estrutura.html">Estrutura</a><a href="socios.html">Sócios</a><a href="loja.html">Loja</a><a href="alugueres.html">Alugueres</a><a href="contactos.html">Contactos</a></nav></noscript>
<main>
  <header class="pagehead on-dark">
    <div class="bar stripes"></div>
    <div class="wrap"><h1>Loja</h1><p>Veste as cores. Equipamentos oficiais <span data-clube="marcaEquipamento">Zemig</span>. As encomendas seguem por WhatsApp ou e-mail para a direção. Para já não há pagamentos online.</p></div>
  </header>
  <section class="section">
    <div class="wrap"><div class="shop__grid" id="shopGrid"></div></div>
  </section>
</main>

<div class="overlay" id="overlay"></div>
<aside class="cart" id="cart" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <div class="cart__head stripes"><h2 id="cartTitle">A tua encomenda</h2><button id="cartClose" aria-label="Fechar encomenda">✕</button></div>
  <div class="cart__items" id="cartItems" aria-live="polite"></div>
  <div class="cart__foot">
    <div class="cart__total"><span>Total</span><b id="cartTotal">0,00 €</b></div>
    <button class="btn btn--solid" id="checkoutWa">Finalizar por WhatsApp</button>
    <button class="btn btn--ghost" id="checkoutMail">Finalizar por e-mail</button>
    <p class="form__msg" id="checkoutMsg" role="status" hidden></p>
    <p class="cart__note">Valores indicativos. A direção confirma disponibilidade e pagamento.</p>
  </div>
</aside>
<footer data-site-footer></footer>
<script src="js/config.js?v=24" defer></script>
<script src="js/site.js?v=24" defer></script>
<script src="js/pages.js?v=24" defer></script>
