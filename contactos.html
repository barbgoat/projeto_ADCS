<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contactos — ADC Sanguedo</title>
<meta name="description" content="Contactos da Associação Desportiva e Cultural de Sanguedo." />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contactos">
<header data-site-nav></header>
<main>
  <header class="pagehead">
    <div class="bar stripes"></div>
    <div class="wrap"><h1>Contactos</h1><p>Fala connosco — estamos aqui para ajudar.</p></div>
  </header>
  <section class="section">
    <div class="wrap contact__grid">
      <div>
        <div id="contactInfo"></div>
        <div class="socials" id="socials"></div>
      </div>
      <div>
        <div class="form">
          <input type="text" id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
          <div class="field"><label for="cn">Nome</label><input id="cn" maxlength="80" autocomplete="name" placeholder="O teu nome" /></div>
          <div class="field"><label for="ce">E-mail</label><input id="ce" type="email" maxlength="120" autocomplete="email" placeholder="email@exemplo.pt" /></div>
          <div class="field"><label for="cm">Mensagem</label><textarea id="cm" rows="5" maxlength="1500" placeholder="Como podemos ajudar?"></textarea></div>
          <button class="btn btn--solid" id="sendMsg">Enviar mensagem</button>
        </div>
      </div>
    </div>
  </section>
</main>
<footer data-site-footer></footer>
<script src="js/config.js" defer></script>
<script src="js/site.js" defer></script>
<script src="js/pages.js" defer></script>
</body>
</html>
