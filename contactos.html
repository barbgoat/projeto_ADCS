<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contactos | ADC Sanguedo</title>
<meta name="description" content="Contactos da Associação Desportiva e Cultural de Sanguedo." />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preload" href="fonts/oswald-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body data-page="contactos">
<header data-site-nav></header>
<noscript><nav class="nav-nojs" aria-label="Principal"><a href="index.html">Início</a><a href="sobre.html">Sobre nós</a><a href="estrutura.html">Estrutura</a><a href="socios.html">Sócios</a><a href="loja.html">Loja</a><a href="alugueres.html">Alugueres</a><a href="contactos.html">Contactos</a></nav></noscript>
<main>
  <header class="pagehead on-dark">
    <div class="bar stripes"></div>
    <div class="wrap"><h1>Contactos</h1><p>Fala connosco, estamos aqui para ajudar.</p></div>
  </header>
  <section class="section">
    <div class="wrap contact__grid">
      <div>
        <div id="contactInfo"></div>
        <div class="socials" id="socials"></div>
      </div>
      <div>
        <form class="form" id="contactForm">
          <div class="field"><label for="cn">Nome</label><input id="cn" maxlength="80" autocomplete="name" placeholder="O teu nome" required /></div>
          <div class="field"><label for="cm">Mensagem</label><textarea id="cm" rows="5" maxlength="1500" placeholder="Como podemos ajudar?" required></textarea></div>
          <div class="form__btns">
            <button type="submit" class="btn btn--solid" value="email">Enviar por e-mail</button>
            <button type="submit" class="btn btn--ghost" value="whatsapp">Enviar por WhatsApp</button>
          </div>
          <p class="form__msg" id="contactMsg" role="status" hidden></p>
        </form>
      </div>
    </div>
  </section>
</main>
<footer data-site-footer></footer>
<script src="js/config.js?v=11" defer></script>
<script src="js/site.js?v=11" defer></script>
<script src="js/pages.js?v=11" defer></script>
</body>
</html>
